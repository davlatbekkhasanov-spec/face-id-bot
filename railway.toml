# Railway Volume: Dashboard -> Volumes -> Add -> Mount path /data
# Env: DATABASE_DIR=/data  TZ=Asia/Tashkent
# Ko'rsatma: PERSISTENCE.md

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node railway.mjs"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
